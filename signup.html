<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 : EDUNAVER</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <div class="signup-wrapper">
        <!-- Logo Header -->
        <header class="signup-header">
            <a href="index.html" class="logo-link">
                <span class="logo-text">
                    EDU<span class="logo-highlight">N<span class="cap-icon"><i class="fa-solid fa-graduation-cap"></i></span>V</span>ER
                </span>
            </a>
        </header>

        <!-- Main Form Box -->
        <main class="signup-container">
            <form id="signup-form" novalidate>
                <!-- Name Field -->
                <div class="input-row">
                    <label for="reg-name" class="input-label">이름</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user input-icon"></i>
                        <input type="text" id="reg-name" placeholder="이름을 입력하세요" required>
                    </div>
                    <div class="field-error" id="error-name">이름을 입력해주세요.</div>
                </div>

                <!-- Date of Birth Field -->
                <div class="input-row">
                    <label for="reg-birthdate" class="input-label">생년월일</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-calendar input-icon"></i>
                        <input type="date" id="reg-birthdate" required>
                    </div>
                    <div class="field-error" id="error-birthdate">올바른 생년월일을 선택해주세요.</div>
                </div>

                <!-- ID Field -->
                <div class="input-row">
                    <label for="reg-username" class="input-label">아이디</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-id-badge input-icon"></i>
                        <input type="text" id="reg-username" placeholder="영문 소문자, 숫자 4~20자" required>
                    </div>
                    <div class="field-error" id="error-username">아이디는 4~20자의 영문 소문자, 숫자여야 합니다.</div>
                    <div class="field-success" id="success-username">사용 가능한 아이디 형태입니다. (중복 확인은 가입 시 수행됩니다)</div>
                </div>

                <!-- Password Field -->
                <div class="input-row">
                    <label for="reg-password" class="input-label">비밀번호</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="reg-password" placeholder="비밀번호 (8자 이상, 문자/숫자/특수문자 조합)" required>
                        <button type="button" class="pw-toggle-btn" tabindex="-1"><i class="fa-regular fa-eye"></i></button>
                    </div>
                    <div class="field-error" id="error-password">비밀번호는 8자 이상이며 문자, 숫자, 특수문자를 포함해야 합니다.</div>
                </div>

                <!-- Password Confirm Field -->
                <div class="input-row">
                    <label for="reg-password-confirm" class="input-label">비밀번호 확인</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-shield-halved input-icon"></i>
                        <input type="password" id="reg-password-confirm" placeholder="비밀번호를 한 번 더 입력하세요" required>
                        <button type="button" class="pw-toggle-btn" tabindex="-1"><i class="fa-regular fa-eye"></i></button>
                    </div>
                    <div class="field-error" id="error-password-confirm">비밀번호가 일치하지 않습니다.</div>
                    <div class="field-success" id="success-password-confirm">비밀번호가 일치합니다.</div>
                </div>

                <!-- Address Field -->
                <div class="input-row">
                    <label for="reg-address" class="input-label">주소</label>
                    <div class="input-wrapper address-group">
                        <i class="fa-regular fa-map input-icon"></i>
                        <input type="text" id="reg-address" placeholder="주소를 입력하세요" required>
                    </div>
                    <div class="field-error" id="error-address">주소를 입력해주세요.</div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn" id="submit-btn">
                    가입하기
                </button>
            </form>
        </main>

        <!-- Footer -->
        <footer class="signup-footer">
            <div class="footer-links">
                <a href="#">이용약관</a>
                <span class="divider"></span>
                <a href="#">개인정보처리방침</a>
                <span class="divider"></span>
                <a href="index.html">홈으로</a>
            </div>
            <p class="copyright">Copyright &copy; EDUNAVER Corp. All Rights Reserved.</p>
        </footer>
    </div>

    <!-- Notification Toast -->
    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check toast-icon" id="toast-icon"></i>
        <span class="toast-message" id="toast-message">회원가입이 완료되었습니다!</span>
    </div>

    <!-- Signup Logic JS -->
    <script src="signup.js"></script>
</body>
</html>
